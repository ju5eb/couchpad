<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14141c">
<title>Couchpad</title>
<style>
  :root { --bg:#14141c; --pad:#23232e; --key:#3a3a48; --text:#e8e8f0; --muted:#8a8aa0; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; overflow:hidden; touch-action:none; }
  #bar { position:fixed; top:6px; left:50%; transform:translateX(-50%); z-index:2; display:flex; align-items:center; gap:10px; white-space:nowrap; }
  #status { font-size:13px; color:var(--muted); }
  #status.ok { color:#7ee2a8; }
  #menuBtn { border:0; border-radius:14px; padding:6px 12px; background:var(--key); color:var(--text); font:inherit; font-size:13px; }

  #menu { position:fixed; inset:0; z-index:5; display:none; flex-direction:column; gap:10px; padding:16px; background:rgba(12,12,18,.97); overflow-y:auto; touch-action:pan-y; }
  #menu.open { display:flex; }
  #menu header { display:flex; justify-content:space-between; align-items:center; }
  #menu h2 { margin:0; font-size:18px; }
  #menu button, #menu label { border:0; border-radius:10px; padding:12px 14px; background:var(--key); color:var(--text); font:inherit; font-size:15px; text-align:left; }
  #menu .current { outline:2px solid #6b4fd8; }
  #menu .upload { background:#6b4fd8; text-align:center; }
  #menu .msg { font-size:13px; color:var(--muted); min-height:1em; }
  #games { display:flex; flex-direction:column; gap:8px; }
  #rotate { display:none; position:fixed; inset:0; align-items:center; justify-content:center; text-align:center; padding:24px; font-size:18px; background:var(--bg); z-index:10; }
  @media (orientation:portrait) { #rotate { display:flex; } }

  .pad { position:fixed; inset:0; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:48px 4vw 16px; }
  .shoulder { position:fixed; top:0; z-index:1; width:30vw; height:44px; background:var(--key); display:flex; align-items:center; justify-content:center; font-weight:600; }
  .shoulder.l { left:0; border-bottom-right-radius:22px; }
  .shoulder.r { right:0; border-bottom-left-radius:22px; }

  .dpad { justify-self:start; display:grid; grid-template-columns:repeat(3, 17vh); grid-template-rows:repeat(3, 17vh); }
  .dpad .k { background:var(--key); }
  .dpad .k[data-b="U"] { grid-area:1/2; border-radius:10px 10px 0 0; }
  .dpad .k[data-b="L"] { grid-area:2/1; border-radius:10px 0 0 10px; }
  .dpad .k[data-b="R"] { grid-area:2/3; border-radius:0 10px 10px 0; }
  .dpad .k[data-b="D"] { grid-area:3/2; border-radius:0 0 10px 10px; }
  .dpad .hub { grid-area:2/2; background:var(--key); }

  .center { display:flex; gap:14px; align-self:end; margin-bottom:6vh; }
  .center .k { width:68px; height:26px; border-radius:13px; background:var(--key); font-size:11px; display:flex; align-items:center; justify-content:center; transform:rotate(-20deg); color:var(--muted); }

  .face { justify-self:end; position:relative; width:56vh; height:56vh; }
  .face .k { position:absolute; width:19vh; height:19vh; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:5vh; color:#fff; }
  .face .k[data-b="X"] { top:0; left:50%; transform:translateX(-50%); background:#4a6fd8; }
  .face .k[data-b="Y"] { top:50%; left:0; transform:translateY(-50%); background:#3fa864; }
  .face .k[data-b="A"] { top:50%; right:0; transform:translateY(-50%); background:#d84a4a; }
  .face .k[data-b="B"] { bottom:0; left:50%; transform:translateX(-50%); background:#d8b84a; }

  .k.on { filter:brightness(1.6); }
</style>
</head>
<body>
  <div id="rotate">Rotate your phone to landscape</div>
  <div id="bar">
    <span id="status">Connecting…</span>
    <button id="menuBtn" type="button">Games</button>
  </div>

  <div id="menu">
    <header>
      <h2>Games</h2>
      <button id="closeBtn" type="button">Close</button>
    </header>
    <label class="upload">Upload a ROM (.sfc / .smc)<input id="file" type="file" hidden></label>
    <button id="overlayBtn" type="button">Show / hide QR on the TV</button>
    <div class="msg" id="msg"></div>
    <div id="games"></div>
  </div>

  <div class="shoulder l k" data-b="SL">L</div>
  <div class="shoulder r k" data-b="SR">R</div>

  <div class="pad">
    <div class="dpad">
      <div class="k" data-b="U"></div>
      <div class="k" data-b="L"></div>
      <div class="hub"></div>
      <div class="k" data-b="R"></div>
      <div class="k" data-b="D"></div>
    </div>
    <div class="center">
      <div class="k" data-b="SE">SELECT</div>
      <div class="k" data-b="ST">START</div>
    </div>
    <div class="face">
      <div class="k" data-b="X">X</div>
      <div class="k" data-b="Y">Y</div>
      <div class="k" data-b="A">A</div>
      <div class="k" data-b="B">B</div>
    </div>
  </div>

<script>
(() => {
  const token = new URLSearchParams(location.search).get("t") || "";
  const statusEl = document.getElementById("status");
  const clientId = loadClientId();
  const pointers = new Map();   // pointerId -> {x, y}
  let held = new Set();         // wire codes currently pressed
  let socket = null;
  let retryMs = 500;
  const POLICY_VIOLATION = 1008; // TV rejected the token: this page came from an old QR
  const STALE_QR = "Old QR code. Scan the one on the TV again.";
  let stale = false;

  function loadClientId() {
    try {
      let id = localStorage.getItem("couchpad-id");
      if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("couchpad-id", id); }
      return id;
    } catch { return Math.random().toString(36).slice(2); }
  }

  function setStatus(text, ok) { statusEl.textContent = text; statusEl.classList.toggle("ok", !!ok); }

  // ---- Latency: ping every 250 ms. Shows round trip on screen and keeps the
  // phone's Wi-Fi radio awake, which avoids power-save spikes between taps.
  const PING_MS = 250;
  const REPORT_MS = 5000;
  const pending = new Map();    // ping id -> sent time
  let samples = [];             // round trips since the last report
  let lastRtt = null;
  let player = null;
  let pingSeq = 0;
  let pingTimer = null;
  let reportTimer = null;

  function showPlayer() {
    if (player === null) return;
    setStatus(lastRtt === null ? `Player ${player}` : `Player ${player} · ${lastRtt} ms`, true);
  }

  function startPings() {
    stopPings();
    pingTimer = setInterval(() => {
      const id = ++pingSeq;
      pending.set(id, performance.now());
      if (pending.size > 20) pending.delete(pending.keys().next().value);
      send("t:" + id);
    }, PING_MS);
    reportTimer = setInterval(() => {
      if (samples.length === 0) return;
      const avg = Math.round(samples.reduce((a, b) => a + b, 0) / samples.length);
      send(`r:${avg}:${Math.max(...samples)}`);
      samples = [];
    }, REPORT_MS);
  }

  function stopPings() {
    clearInterval(pingTimer);
    clearInterval(reportTimer);
    pending.clear();
  }

  function onPong(id) {
    const sent = pending.get(id);
    if (sent === undefined) return;
    pending.delete(id);
    lastRtt = Math.round(performance.now() - sent);
    samples.push(lastRtt);
    showPlayer();
  }

  function connect() {
    socket = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}&id=${encodeURIComponent(clientId)}`);
    socket.onmessage = (e) => {
      if (e.data.startsWith("t:")) { onPong(Number(e.data.slice(2))); return; }
      if (e.data === "full") { setStatus("Game is full"); return; }
      if (e.data.startsWith("p:")) { player = e.data.slice(2); showPlayer(); retryMs = 500; startPings(); }
    };
    socket.onclose = (e) => {
      stopPings();
      player = null;
      lastRtt = null;
      releaseAll();
      if (e.code === POLICY_VIOLATION) { stale = true; setStatus(STALE_QR); return; }
      setStatus("Reconnecting…");
      setTimeout(connect, retryMs);
      retryMs = Math.min(retryMs * 2, 5000);
    };
  }

  function send(msg) { if (socket && socket.readyState === WebSocket.OPEN) socket.send(msg); }

  function buttonsUnderPointers() {
    const now = new Set();
    for (const { x, y } of pointers.values()) {
      const el = document.elementFromPoint(x, y);
      const key = el && el.closest("[data-b]");
      if (key) now.add(key.dataset.b);
    }
    return now;
  }

  function sync() {
    const now = buttonsUnderPointers();
    for (const b of now) if (!held.has(b)) { send("d:" + b); mark(b, true); if (navigator.vibrate) navigator.vibrate(8); }
    for (const b of held) if (!now.has(b)) { send("u:" + b); mark(b, false); }
    held = now;
  }

  function releaseAll() { pointers.clear(); sync(); }

  function mark(b, on) { document.querySelectorAll(`[data-b="${b}"]`).forEach(el => el.classList.toggle("on", on)); }

  // Taps on the bar and the games menu behave like a normal page, not like the gamepad.
  const isMenuUi = (e) => e.target instanceof Element && !!e.target.closest("#bar, #menu");
  const track = (e) => { if (isMenuUi(e)) return; e.preventDefault(); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); sync(); };
  const untrack = (e) => { if (!pointers.has(e.pointerId)) return; e.preventDefault(); pointers.delete(e.pointerId); sync(); };

  document.addEventListener("pointerdown", (e) => {
    if (isMenuUi(e)) return;
    track(e);
    if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }, { passive: false });
  document.addEventListener("pointermove", (e) => { if (pointers.has(e.pointerId)) track(e); }, { passive: false });
  document.addEventListener("pointerup", untrack, { passive: false });
  document.addEventListener("pointercancel", untrack, { passive: false });
  document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });
  document.addEventListener("contextmenu", (e) => { if (!isMenuUi(e)) e.preventDefault(); });

  // ---- Games menu ----
  const MAX_BYTES = 8 * 1024 * 1024;
  const menu = document.getElementById("menu");
  const gamesEl = document.getElementById("games");
  const msgEl = document.getElementById("msg");
  const fileInput = document.getElementById("file");

  const api = async (path, params = {}, options = {}) => {
    const query = new URLSearchParams({ ...params, token });
    const response = await fetch(`${path}?${query}`, options);
    if (response.status === 403) { stale = true; showMessage(STALE_QR); setStatus(STALE_QR); throw new Error("stale token"); }
    return response;
  };

  // Once the token is known to be stale, nothing else matters until the user rescans.
  function showMessage(text) { msgEl.textContent = stale ? STALE_QR : text; }

  async function loadGames() {
    gamesEl.textContent = "";
    try {
      const response = await api("/games");
      const lines = (await response.text()).split("\n").filter(Boolean);
      if (lines.length === 0) { showMessage("No games yet. Upload one to start."); return; }
      for (const line of lines) {
        const current = line.startsWith("*");
        const name = current ? line.slice(1) : line;
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = (current ? "▶ " : "") + name.replace(/\.(sfc|smc)$/i, "");
        if (current) button.classList.add("current");
        button.addEventListener("click", () => play(name));
        gamesEl.appendChild(button);
      }
    } catch { showMessage("Could not load the game list."); }
  }

  async function play(name) {
    showMessage(`Starting ${name}…`);
    const response = await api("/play", { name }, { method: "POST" }).catch(() => null);
    if (response && response.ok) { closeMenu(); } else { showMessage("Could not start that game."); }
  }

  async function upload(file) {
    if (!/\.(sfc|smc)$/i.test(file.name)) { showMessage("Only .sfc or .smc files are supported."); return; }
    if (file.size > MAX_BYTES) { showMessage("The file is larger than 8 MB."); return; }
    showMessage(`Uploading ${file.name}…`);
    try {
      const response = await api("/games", { name: file.name }, {
        method: "POST",
        headers: { "Content-Type": "application/octet-stream" },
        body: file,
      });
      const text = await response.text();
      if (!response.ok) { showMessage(text || "Upload failed."); return; }
      await play(text);
    } catch { showMessage("Upload failed. Check the connection to the TV."); }
  }

  function openMenu() { releaseAll(); showMessage(""); menu.classList.add("open"); if (!stale) loadGames(); }
  function closeMenu() { menu.classList.remove("open"); }

  document.getElementById("menuBtn").addEventListener("click", openMenu);
  document.getElementById("closeBtn").addEventListener("click", closeMenu);
  document.getElementById("overlayBtn").addEventListener("click", async () => {
    try { await api("/overlay", {}, { method: "POST" }); closeMenu(); }
    catch { showMessage("Could not reach the TV."); }
  });
  fileInput.addEventListener("change", () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (file) upload(file);
  });

  connect();
})();
</script>
</body>
</html>
