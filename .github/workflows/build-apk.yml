name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch emulator cores
        run: |
          chmod +x scripts/fetch-core.sh gradlew
          scripts/fetch-core.sh armeabi-v7a
          scripts/fetch-core.sh arm64-v8a
      - name: Build
        run: ./gradlew assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk couchpad.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest couchpad.apk --title "Couchpad" --notes "Debug build"
